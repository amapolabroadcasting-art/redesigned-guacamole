name: Send Email via Educentra Mail

on:
  workflow_dispatch:  # manually trigger

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Send email using educentra.ai SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: educentra.ai
          server_port: 465
          secure: true                         # Use SSL/TLS
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub Action Email Test"
          to: "edwardlorilla1986@gmail.com"
          from: "partnerwithus@educentra.ai"
          body: |
            This is a test email sent from GitHub Actions
            using the secure SMTP settings of educentra.ai.
