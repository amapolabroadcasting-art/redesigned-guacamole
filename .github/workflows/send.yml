name: Send email via educentra.ai

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient email address"
        required: true
      subject:
        description: "Email subject"
        required: true
      body:
        description: "Email body (plain text)"
        required: true

jobs:
  send-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Send email via educentra.ai SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          # Try the canonical mail host if available
          server_address: mail.educentra.ai
          server_port: 587

          # For port 587, let STARTTLS negotiate:
          secure: false

          username: ${{ secrets.MAIL_USERNAME }}   # partnerwithus@educentra.ai
          password: ${{ secrets.MAIL_PASSWORD }}

          from: partnerwithus@educentra.ai
          to: ${{ github.event.inputs.to }}
          subject: ${{ github.event.inputs.subject }}
          body: ${{ github.event.inputs.body }
